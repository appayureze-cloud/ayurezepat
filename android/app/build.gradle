plugins {
    id "com.android.application"
    // START: FlutterFire Configuration
    id 'com.google.gms.google-services'
    // END: FlutterFire Configuration
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader('UTF-8') { reader ->
        localProperties.load(reader)
    }
}

def flutterVersionCode = localProperties.getProperty('flutter.versionCode')
if (flutterVersionCode == null) {
    flutterVersionCode = '1'
}

def flutterVersionName = localProperties.getProperty('flutter.versionName')
if (flutterVersionName == null) {
    flutterVersionName = '1.1'
}

// Signing config: loaded from android/key.properties for local dev builds
// (gitignored - copy key.properties.example and fill in real values), or
// from CI environment variables so the keystore/passwords never touch git.
// See docs/backend/../README rotation notes for what to store in CI secrets:
//   ANDROID_KEYSTORE_PATH, ANDROID_KEYSTORE_STORE_PASSWORD,
//   ANDROID_KEYSTORE_KEY_ALIAS, ANDROID_KEYSTORE_KEY_PASSWORD,
//   ANDROID_MAPS_API_KEY
def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file('key.properties')
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

def envOrProperty = { String envName, String propName ->
    def envValue = System.getenv(envName)
    if (envValue != null && !envValue.isEmpty()) {
        return envValue
    }
    return keystoreProperties[propName]
}

def resolvedStoreFile = envOrProperty('ANDROID_KEYSTORE_PATH', 'storeFile')
def resolvedMapsApiKey = System.getenv('ANDROID_MAPS_API_KEY') ?: localProperties.getProperty('MAPS_API_KEY') ?: ''

android {
    namespace "com.ayureze.patient"
    compileSdkVersion 36

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
        coreLibraryDesugaringEnabled true
    }

    kotlinOptions {
        jvmTarget = "1.8"
    }


    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }

    defaultConfig {
        applicationId "com.ayureze.patient"
        minSdkVersion 24
        targetSdkVersion 36
        versionCode flutterVersionCode.toInteger()
        versionName flutterVersionName
        multiDexEnabled true
        manifestPlaceholders = [mapsApiKey: resolvedMapsApiKey]
//
//        ndk {
//            abiFilters "arm64-v8a", "armeabi-v7a"
//        }
    }

    packaging {
        jniLibs {
            useLegacyPackaging false
        }
    }

    signingConfigs {
        release {
            keyAlias envOrProperty('ANDROID_KEYSTORE_KEY_ALIAS', 'keyAlias')
            keyPassword envOrProperty('ANDROID_KEYSTORE_KEY_PASSWORD', 'keyPassword')
            storeFile resolvedStoreFile ? file(resolvedStoreFile) : null
            storePassword envOrProperty('ANDROID_KEYSTORE_STORE_PASSWORD', 'storePassword')
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false
            signingConfig signingConfigs.release
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'

        }

    }
}

flutter {
    source '../..'
}

dependencies {

    implementation 'com.google.android.material:material:1.11.0'
    implementation 'com.google.android.gms:play-services-auth:20.7.0'
    implementation 'com.google.android.gms:play-services-auth-api-phone:18.0.1'
    implementation 'com.google.android.gms:play-services-wallet:19.2.0'
    implementation 'com.razorpay:checkout:1.6.26'
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.0.4'
}
