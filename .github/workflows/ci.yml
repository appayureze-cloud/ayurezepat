name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  FLUTTER_VERSION: '3.35.0'

jobs:
  analyze_and_test:
    name: Analyze & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable

      - name: Install dependencies
        run: flutter pub get

      - name: Generate code (retrofit / json_serializable)
        run: flutter pub run build_runner build --delete-conflicting-outputs

      - name: Analyze
        run: flutter analyze

      - name: Format check
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Run tests
        run: flutter test

  build_apk:
    name: Build debug APK
    runs-on: ubuntu-latest
    needs: analyze_and_test
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install dependencies
        run: flutter pub get

      - name: Generate code (retrofit / json_serializable)
        run: flutter pub run build_runner build --delete-conflicting-outputs

      # Debug builds don't need the release keystore, so this job runs on
      # every PR without touching signing secrets. A release-signed build
      # is a separate, manually triggered workflow that reads
      # ANDROID_KEYSTORE_PATH / ANDROID_KEYSTORE_STORE_PASSWORD /
      # ANDROID_KEYSTORE_KEY_ALIAS / ANDROID_KEYSTORE_KEY_PASSWORD /
      # ANDROID_MAPS_API_KEY from repository secrets (see
      # android/key.properties.example and android/app/build.gradle).
      - name: Build debug APK
        run: flutter build apk --debug --dart-define=GOOGLE_MAPS_API_KEY=

      - uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 7
